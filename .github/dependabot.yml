# Dependabot — GitHub Actions only (repository CI policy)
# Do not add npm here unless a separate ADR expands package ecosystems.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
