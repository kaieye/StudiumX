name: Release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            artifact: windows-x64
            args: --win --x64
            manifest: win
          - name: Linux
            os: ubuntu-22.04
            artifact: linux-x64
            args: --linux --x64
            manifest: linux
          - name: macOS (Apple Silicon)
            os: macos-14
            artifact: macos-arm64
            args: --mac --arm64
            manifest: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const version = require("./package.json").version; if (process.env.TAG !== "v" + version) throw new Error(`Tag ${process.env.TAG} must match package version v${version}`)'

      - name: Build installer
        run: pnpm run dist -- ${{ matrix.args }} --publish never

      - name: Recreate update manifest
        run: node scripts/release/write-update-manifest.mjs ${{ matrix.manifest }} release

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          # builder-debug.yml is intentionally omitted: every matrix job
          # creates one with the same file name, while a GitHub Release may
          # contain each asset name only once.
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${TAG}.md"
          test -f "$NOTES_FILE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/**/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" release-assets/**/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "StudiumX ${TAG#v}" \
              --notes-file "$NOTES_FILE"
          fi
