# OSV dependency scan — fail-open supply-chain signal (A-09 / ADR-0054)
#
# Intentional non-blocking job: findings are reported (log + optional artifact)
# but must NOT replace or fail the teaching/privacy/security merge gates in
# blocking-ci.yml (ADR-0023). Keep fail-open if scanner, network, or upload
# steps error.

name: OSV dependency scan (fail-open)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:17 UTC — independent of teaching blocking CI
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV scanner (non-blocking)
    runs-on: ubuntu-24.04
    # Job-level fail-open: never red the merge gate for OSV alone.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run OSV Scanner (JSON report)
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --format=json
            --output=osv-results.json
            ./

      - name: Human-readable OSV table (best-effort)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --format=table
            ./

      - name: Upload OSV results artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-scan-results
          path: osv-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail-open summary
        if: always()
        run: |
          echo "OSV scan is informational (fail-open / non-blocking)."
          echo "Teaching, privacy, and security merge gates remain in blocking-ci.yml."
          echo "Scanner step conclusion: ${{ steps.osv.conclusion }}"
          if [ -f osv-results.json ]; then
            echo "JSON report present (see artifact osv-scan-results)."
            wc -c osv-results.json || true
          else
            echo "No JSON report file (scanner may have failed; still fail-open)."
          fi
